<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChingBank 點數儀表板</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            width: 320px;
        }
        h1 {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 10px;
        }
        .points-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #2563eb;
            margin: 20px 0;
        }
        .refresh-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .refresh-btn:hover {
            background-color: #1d4ed8;
        }
        .loading {
            font-size: 0.9rem;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>ChingBank 目前點數</h1>
        <div id="points" class="points-display">載入中...</div>
        <button class="refresh-btn" onclick="fetchPoints()">重新整理</button>
        <div id="status" class="loading"></div>
    </div>

    <script>
        // 你的 Google Apps Script Web App 網址
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyHvdcxDuUgI5TMR5pJp2uYmxkOmWCH0ftkgFY_trWiEj0jOMii2UphTuMjEd-GPhvK/exec';

        async function fetchPoints() {
            const pointsEl = document.getElementById('points');
            const statusEl = document.getElementById('status');
            
            statusEl.innerText = "正在同步最新點數...";
            
            try {
                // 加上時間戳記 ?t=... 避免瀏覽器快取舊資料
                const response = await fetch(`${scriptUrl}?t=${Date.now()}`);
                const data = await response.json();
                
                if (typeof data.points !== 'undefined') {
                    pointsEl.innerText = data.points;
                    statusEl.innerText = "同步成功！";
                } else {
                    pointsEl.innerText = "錯誤";
                    statusEl.innerText = "資料格式不符";
                }
            } catch (error) {
                console.error(error);
                pointsEl.innerText = "連線失敗";
                statusEl.innerText = "請檢查網路連線";
            }
        }

        // 網頁一打開自動抓取一次
        fetchPoints();
    </script>

</body>
</html>
