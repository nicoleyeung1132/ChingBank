<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大人專屬魔法小卡 - ChingBank</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #4E8EF3;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background: linear-gradient(135deg, #1e3a8a 0%, #2A4B83 100%);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: white;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .title-group h1 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }
        .points-box {
            text-align: right;
        }
        .points-label {
            font-size: 0.75rem;
            color: #93c5fd;
            margin-bottom: 2px;
        }
        .points-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
        }
        /* 重新整理按鈕移至點數下方 */
        .refresh-hint {
            font-size: 0.7rem;
            color: #93c5fd;
            cursor: pointer;
            margin-top: 4px;
            text-align: right;
            transition: color 0.2s;
        }
        .refresh-hint:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .credit-card-art {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            display: block;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 4px;
        }
        .info-label {
            font-size: 0.75rem;
            color: #93c5fd;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        /* QR Code 區塊改為置中且白色背景剛好包覆 */
        .qr-container {
            text-align: center;
        }
        .qr-section {
            display: inline-block;
            background: white;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            color: #333;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .qr-image {
            width: 160px;
            height: 160px;
            margin: 0 auto 8px auto;
            display: block;
        }
        .qr-date {
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 頂部標題與即時點數 -->
        <div class="header">
            <div class="header-left">
                <!-- 頭貼圖片 -->
                <img src="去背標籤圖.png" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/45'">
                <div class="title-group">
                    <h1>大人專屬魔法小卡</h1>
                </div>
            </div>
            <div class="points-box">
                <div class="points-label">剩餘點數</div>
                <div id="points" class="points-value">載入中...</div>
                <!-- 重新整理按鈕放置於點數下方 -->
                <div class="refresh-hint" onclick="fetchPoints()">🔄 重新整理點數</div>
            </div>
        </div>

        <!-- 魔法小卡卡面圖片 -->
        <img src="卡片正面_1.png" alt="Credit Card" class="credit-card-art" onerror="this.style.display='none'">

        <!-- 使用期限與銀行代碼 -->
        <div class="info-row">
            <div>
                <div class="info-label">使用期限</div>
                <div class="info-value">2027/11/22</div>
            </div>
            <div style="text-align: right;">
                <div class="info-label">銀行代碼</div>
                <div class="info-value">Ching</div>
            </div>
        </div>

        <!-- QR Code 區塊 (白底剛好包覆) -->
        <div class="qr-container">
            <div class="qr-section">
                <img src="Birthday Wish-MV.png" alt="QR Code" class="qr-image" onerror="this.src='https://via.placeholder.com/160?text=QR+Code'">
                <div class="qr-date">20261031</div>
            </div>
        </div>
    </div>

    <script>
        // 你的 Google Apps Script 網址
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyHvdcxDuUgI5TMR5pJp2uYmxkOmWCH0ftkgFY_trWiEj0jOMii2UphTuMjEd-GPhvK/exec';

        async function fetchPoints() {
            const pointsEl = document.getElementById('points');
            pointsEl.innerText = "載入中...";
            
            try {
                // 加上時間戳記避免瀏覽器快取
                const response = await fetch(`${scriptUrl}?t=${Date.now()}`);
                const data = await response.json();
                
                if (typeof data.points !== 'undefined') {
                    // 自動加上千分位逗號（例如 2500 變成 2,500）
                    pointsEl.innerText = Number(data.points).toLocaleString();
                } else {
                    pointsEl.innerText = "---";
                }
            } catch (error) {
                console.error(error);
                pointsEl.innerText = "錯誤";
            }
        }

        // 網頁開啟時自動抓取最新點數
        fetchPoints();
    </script>

</body>
</html>
