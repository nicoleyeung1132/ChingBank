<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大人專屬魔法小卡 - ChingBank</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #4E8EF3;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
            box-sizing: border-box;
        }
        .card-container {
            background: linear-gradient(135deg, #1e3a8a 0%, #2A4B83 100%);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .title-group h1 {
            font-size: 1.05rem;
            margin: 0;
            font-weight: 600;
        }
        .points-box {
            text-align: right;
        }
        .points-label {
            font-size: 0.7rem;
            color: #93c5fd;
            margin-bottom: 2px;
        }
        .points-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }
        .refresh-hint {
            font-size: 0.65rem;
            color: #93c5fd;
            cursor: pointer;
            margin-top: 2px;
            text-align: right;
            transition: color 0.2s;
        }
        .refresh-hint:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .credit-card-art {
            width: 112%;
            margin-left: -6%;
            border-radius: 12px;
            margin-bottom: 12px;
            display: block;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .info-label {
            font-size: 0.7rem;
            color: #93c5fd;
            margin-bottom: 2px;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .qr-container {
            text-align: center;
            margin-bottom: 14px;
        }
        .qr-section {
            display: inline-block;
            background: white;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            color: #333;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
        .qr-image {
            width: 130px;
            height: 130px;
            margin: 0 auto 6px auto;
            display: block;
        }
        .qr-date {
            font-size: 0.8rem;
            color: #555;
            font-weight: 500;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: white;
            width: 100%;
            padding: 11px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* 通用頁面切換 */
        .sub-page {
            display: none;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .page-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }
        .action-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-sm {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-refresh {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 14px;
        }
        .tx-card, .coupon-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }
        .delete-btn:hover { background: rgba(225, 29, 72, 0.9); }

        .card-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .card-info {
            padding: 8px;
            font-size: 0.75rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-date { color: #666; font-size: 0.65rem; margin-bottom: 2px; }
        .card-name { font-weight: bold; color: #1e3a8a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-price { color: #e11d48; font-weight: bold; }

        /* 兌換券專用按鈕 */
        .use-coupon-btn {
            background: #16a34a;
            color: white;
            border: none;
            width: 100%;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 4px;
        }
        .coupon-used-tag {
            color: #9ca3af;
            font-weight: bold;
            text-align: center;
            margin-top: 4px;
            font-size: 0.75rem;
        }

        /* 彈跳視窗 */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
        }
        .modal-content h3 { margin-top: 0; font-size: 1.1rem; }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btns button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-cancel { background: #cbd5e1; }
        .btn-submit { background: #2563eb; color: white; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 頁面一：魔法小卡首頁 -->
        <div id="main-page">
            <div class="header">
                <div class="header-left">
                    <img src="去背標籤圖.png" alt="Avatar" class="avatar" onerror="this.src='https://via.placeholder.com/45'">
                    <div class="title-group">
                        <h1>大人專屬魔法小卡</h1>
                    </div>
                </div>
                <div class="points-box">
                    <div class="points-label">剩餘點數</div>
                    <div id="points" class="points-value">載入中...</div>
                    <div class="refresh-hint" onclick="fetchPoints()">🔄 重新整理點數</div>
                </div>
            </div>

            <img src="卡片正面_DPIfix.png" alt="Credit Card" class="credit-card-art" onerror="this.style.display='none'">

            <div class="info-row">
                <div>
                    <div class="info-label">使用期限</div>
                    <div class="info-value">2027/11/22</div>
                </div>
                <div style="text-align: right;">
                    <div class="info-label">銀行代碼</div>
                    <div class="info-value">Ching</div>
                </div>
            </div>

            <div class="qr-container">
                <div class="qr-section">
                    <img src="Birthday Wish-MV.png" alt="QR Code" class="qr-image" onerror="this.src='https://via.placeholder.com/160?text=QR+Code'">
                    <div class="qr-date">20261122TING</div>
                </div>
            </div>

            <button class="nav-btn" onclick="showHistoryPage()">📜 查看歷史交易紀錄</button>
            <button class="nav-btn" onclick="showCouponsPage()">🎟️ 我的兌換券票卡</button>
        </div>

        <!-- 頁面二：歷史交易紀錄牆 -->
        <div id="history-page" class="sub-page">
            <div class="page-header">
                <h2 class="page-title">📜 歷史紀錄</h2>
                <div class="action-group">
                    <button class="btn-refresh" onclick="fetchHistory()">🔄 重新整理</button>
                    <button class="btn-sm" onclick="openModal()">+ 記一筆</button>
                </div>
            </div>

            <div id="gallery" class="grid-gallery">
                <div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">載入記錄中...</div>
            </div>

            <button class="nav-btn" onclick="showMainPage()">🔙 返回魔法小卡</button>
        </div>

        <!-- 頁面三：我的兌換券票卡 (新增) -->
        <div id="coupons-page" class="sub-page">
            <div class="page-header">
                <h2 class="page-title">🎟️ 我的兌換券</h2>
                <div class="action-group">
                    <button class="btn-refresh" onclick="fetchCoupons()">🔄 重新整理</button>
                </div>
            </div>

            <div id="coupon-gallery" class="grid-gallery">
                <div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">載入兌換券中...</div>
            </div>

            <button class="nav-btn" onclick="showMainPage()">🔙 返回魔法小卡</button>
        </div>
    </div>

    <!-- 新增交易紀錄彈跳視窗 -->
    <div id="modal">
        <div class="modal-content">
            <h3>新增交易紀錄</h3>
            <label style="font-size:0.8rem;">品項名稱：</label>
            <input type="text" id="tx-title" placeholder="例如：星巴克咖啡">
            
            <label style="font-size:0.8rem;">價格 / 點數：</label>
            <input type="number" id="tx-price" placeholder="例如：150">
            
            <label style="font-size:0.8rem;">照片 (拍照或上傳)：</label>
            <input type="file" id="tx-file" accept="image/*">
            
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-submit" onclick="submitTransaction()">送出</button>
            </div>
        </div>
    </div>

    <script>
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyHvdcxDuUgI5TMR5pJp2uYmxkOmWCH0ftkgFY_trWiEj0jOMii2UphTuMjEd-GPhvK/exec';

        // 頁面載入時檢查是否有 QR Code 掃描帶入的領券請求
        window.addEventListener('DOMContentLoaded', async () => {
            fetchPoints();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'claim') {
                const title = urlParams.get('title') || '專屬賀卡兌換券';
                const cost = urlParams.get('cost') || 0;
                const image = urlParams.get('image') || '';
                
                try {
                    const response = await fetch(scriptUrl, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'claim_coupon', title, cost, image })
                    });
                    const result = await response.json();
                    if (result.success) {
                        alert(`🎉 恭喜獲得【${title}】！已自動放入您的票卡中。`);
                        // 清除網址參數並跳轉到兌換券頁面
                        window.history.replaceState({}, document.title, window.location.pathname);
                        showCouponsPage();
                        return;
                    }
                } catch (e) {
                    console.error(e);
                    alert('自動領券失敗，請稍後再試');
                }
            }
        });

        async function fetchPoints() {
            const pointsEl = document.getElementById('points');
            pointsEl.innerText = "載入中...";
            try {
                const response = await fetch(`${scriptUrl}?t=${Date.now()}`);
                const data = await response.json();
                if (typeof data.points !== 'undefined') {
                    pointsEl.innerText = Number(data.points).toLocaleString();
                } else {
                    pointsEl.innerText = "---";
                }
            } catch (error) {
                console.error(error);
                pointsEl.innerText = "錯誤";
            }
        }

        // 頁面切換控制
        function showMainPage() {
            document.getElementById('history-page').style.display = 'none';
            document.getElementById('coupons-page').style.display = 'none';
            document.getElementById('main-page').style.display = 'block';
        }

        function showHistoryPage() {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('coupons-page').style.display = 'none';
            document.getElementById('history-page').style.display = 'block';
            fetchHistory();
        }

        function showCouponsPage() {
            document.getElementById('main-page').style.display = 'none';
            document.getElementById('history-page').style.display = 'none';
            document.getElementById('coupons-page').style.display = 'block';
            fetchCoupons();
        }

        function formatTimestamp(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return isoString;
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
        }

        // 取得歷史紀錄
        async function fetchHistory() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">載入記錄中...</div>';
            
            try {
                const response = await fetch(`${scriptUrl}?action=history&t=${Date.now()}`);
                const list = await response.json();
                
                if (list.length === 0) {
                    gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">目前尚無交易紀錄</div>';
                    return;
                }
                
                gallery.innerHTML = '';
                list.forEach(item => {
                    const formattedDate = formatTimestamp(item.timestamp);
                    const card = document.createElement('div');
                    card.className = 'tx-card';
                    card.innerHTML = `
                        <button class="delete-btn" onclick="deleteTransaction('${item.id}', event)" title="刪除">✕</button>
                        <img src="${item.image || 'https://via.placeholder.com/150?text=No+Image'}" class="card-img" onerror="this.src='https://via.placeholder.com/150?text=Image+Error'">
                        <div class="card-info">
                            <div>
                                <div class="card-date">${formattedDate}</div>
                                <div class="card-name" title="${item.title}">${item.title}</div>
                            </div>
                            <div class="card-price">-$${item.price}</div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #f87171; padding: 40px;">載入失敗</div>';
            }
        }

        // 取得兌換券清單 (新增)
        async function fetchCoupons() {
            const gallery = document.getElementById('coupon-gallery');
            gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">載入兌換券中...</div>';
            
            try {
                const response = await fetch(`${scriptUrl}?action=coupons&t=${Date.now()}`);
                const list = await response.json();
                
                if (list.length === 0) {
                    gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #93c5fd; padding: 40px;">目前尚無兌換券，快去掃描賀卡 QR Code 吧！</div>';
                    return;
                }
                
                gallery.innerHTML = '';
                list.forEach(item => {
                    const isUsed = item.status === 'used';
                    const card = document.createElement('div');
                    card.className = 'coupon-card';
                    card.innerHTML = `
                        <img src="${item.image || 'https://via.placeholder.com/150?text=Coupon'}" class="card-img" onerror="this.src='https://via.placeholder.com/150?text=Image+Error'">
                        <div class="card-info">
                            <div>
                                <div class="card-name" title="${item.title}">${item.title}</div>
                                <div class="card-date">價值: ${item.cost} 點</div>
                            </div>
                            ${isUsed 
                                ? `<div class="coupon-used-tag">✓ 已核消</div>` 
                                : `<button class="use-coupon-btn" onclick="useCoupon('${item.id}')">立即核消</button>`
                            }
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                gallery.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #f87171; padding: 40px;">載入失敗</div>';
            }
        }

        // 核消兌換券 (新增)
        async function useCoupon(id) {
            if (!confirm('確定要核消這張兌換券嗎？核消後將無法恢復。')) return;

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'use_coupon', id: id })
                });
                const result = await response.json();
                if (result.success) {
                    alert('核消成功！');
                    fetchCoupons();
                } else {
                    alert('核消失敗：' + result.message);
                }
            } catch (error) {
                console.error(error);
                alert('連線錯誤，核消失敗');
            }
        }

        async function deleteTransaction(id, event) {
            event.stopPropagation();
            if (!confirm('確定要刪除這筆歷史紀錄嗎？')) return;

            try {
                const response = await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete_history', id: id })
                });
                const result = await response.json();
                if (result.success) {
                    fetchHistory();
                } else {
                    alert('刪除失敗：' + result.message);
                }
            } catch (error) {
                console.error(error);
                alert('連線錯誤，刪除失敗');
            }
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function submitTransaction() {
            const title = document.getElementById('tx-title').value;
            const price = document.getElementById('tx-price').value;
            const fileInput = document.getElementById('tx-file');
            
            if (!title || !price) {
                alert('請填寫品項名稱與價格！');
                return;
            }

            let imageUrl = '';
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                imageUrl = await toBase64(file);
            }

            const payload = {
                action: 'add_history',
                title: title,
                price: price,
                image: imageUrl,
                timestamp: new Date().toISOString()
            };

            document.querySelector('.btn-submit').innerText = '儲存中...';

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                closeModal();
                document.getElementById('tx-title').value = '';
                document.getElementById('tx-price').value = '';
                document.getElementById('tx-file').value = '';
                fetchHistory();
            } catch (error) {
                console.error(error);
                alert('儲存失敗，請稍後再試');
            } finally {
                document.querySelector('.btn-submit').innerText = '送出';
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        fetchPoints();
    </script>
</body>
</html>
